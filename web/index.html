<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RV32IM Emulator</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background:#101114; color:#eee }
    * { box-sizing:border-box }
    body { min-height:100dvh; margin:0; padding:.6rem; display:grid; place-items:center }
    main { width:100%; text-align:center }
    h1 { margin:.25rem 0 1.25rem }
    #screen-wrap { position:relative; width:min(800px,88vw,calc((100dvh - 285px) * 1.6)); max-width:100%; margin:auto }
    canvas { display:block; width:100%; height:auto; image-rendering:pixelated; border:1px solid #555; background:#000 }
    #status { position:absolute; inset:0; display:grid; place-items:center; padding:1rem; background:rgba(0,0,0,.72); color:#fff; font:600 15px ui-monospace,monospace; text-align:center; text-shadow:0 1px 2px #000 }
    #status.is-hidden { display:none }
    #stats { margin:1.25rem auto 0; width:min(640px,88vw); display:grid; grid-template-columns:repeat(3,1fr); gap:.3rem .75rem; color:#9fd; font:12px ui-monospace,monospace; text-align:left }
    #legend { margin:1.5rem auto 0; width:min(760px,92vw); display:flex; flex-wrap:wrap; justify-content:center; gap:.8rem 1.25rem; color:#bbb; font-size:12px; line-height:1.45 }
    #legend span { white-space:nowrap }
    #legend kbd { padding:.08rem .3rem; border:1px solid #666; border-radius:.2rem; background:#25272c; color:#fff; font:inherit; white-space:nowrap; cursor:pointer; user-select:none; touch-action:none }
    #legend kbd:hover { border-color:#aaa; background:#34373e }
    #legend kbd:active { transform:translateY(1px); background:#555b66 }
  </style>
</head>
<body><main>
  <h1>RISC-V RV32IM</h1>
  <div id="screen-wrap">
    <canvas id="screen" width="640" height="400"></canvas>
    <div id="status">Preparing emulator…</div>
  </div>
  <div id="stats">
    <span id="mips">MIPS: —</span><span id="fps">FPS: —</span><span id="total-ms">Frame: —</span>
    <span id="emu-ms">CPU: —</span><span id="convert-ms">Pixels: —</span><span id="canvas-ms">Canvas: —</span>
  </div>
  <div id="legend">
    <span><kbd data-key="ArrowUp">↑</kbd>/<kbd data-key="ArrowDown">↓</kbd> move</span>
    <span><kbd data-key="ArrowLeft">←</kbd>/<kbd data-key="ArrowRight">→</kbd> turn</span>
    <span><kbd data-key="Control">Ctrl</kbd> shoot</span>
    <span><kbd data-key="Space">Space</kbd> use/open</span>
    <span><kbd data-key="Shift">Shift</kbd> run</span>
    <span><kbd data-key="Escape">Esc</kbd> menu</span>
    <span><kbd data-key="Enter">Enter</kbd> select</span>
  </div>
</main>
<script type="module">
import init, { WasmRiscv } from './pkg/riscv_emu_wasm.js';
const canvas=document.querySelector('#screen'), ctx=canvas.getContext('2d'), status=document.querySelector('#status');
const metrics={mips:document.querySelector('#mips'),fps:document.querySelector('#fps'),total:document.querySelector('#total-ms'),emu:document.querySelector('#emu-ms'),convert:document.querySelector('#convert-ms'),canvas:document.querySelector('#canvas-ms')};
let emu, wasmMemory, running=false, loading=false;
const INSTRUCTIONS_PER_FRAME=2000000;
let sample={instructions:0,emuMs:0,convertMs:0,canvasMs:0,frames:0,started:0};
const keys={Enter:1,Escape:2,ArrowLeft:3,ArrowRight:4,ArrowUp:5,ArrowDown:6,Control:7,' ':8,Space:8,Shift:9,Alt:10};
const pressedKeys=new Map();
const pointerKeys=new Map();
function doomKey(event){
 const mapped=keys[event.key];
 if(mapped)return mapped;
 return event.key.length===1?event.key.toLowerCase().charCodeAt(0):null;
}
document.addEventListener('keydown',event=>{
 const key=doomKey(event);
 if(key===null)return;
 event.preventDefault();
 if(!running||event.repeat||pressedKeys.has(event.code))return;
 pressedKeys.set(event.code,key);
 emu.push_key_event(key,true);
});
document.addEventListener('keyup',event=>{
 const key=pressedKeys.get(event.code)??doomKey(event);
 if(key===null)return;
 event.preventDefault();
 pressedKeys.delete(event.code);
 if(running)emu.push_key_event(key,false);
});
window.addEventListener('blur',()=>{
 if(running)for(const key of pressedKeys.values())emu.push_key_event(key,false);
 if(running)for(const key of pointerKeys.values())emu.push_key_event(key,false);
 pressedKeys.clear();
 pointerKeys.clear();
});
function releasePointerKey(event){
 const key=pointerKeys.get(event.pointerId);
 if(key===undefined)return;
 event.preventDefault();
 pointerKeys.delete(event.pointerId);
 if(running)emu.push_key_event(key,false);
}
for(const control of document.querySelectorAll('#legend kbd')){
 control.addEventListener('pointerdown',event=>{
  const key=keys[control.dataset.key];
  if(!running||key===undefined||pointerKeys.has(event.pointerId))return;
  event.preventDefault();
  pointerKeys.set(event.pointerId,key);
  control.setPointerCapture(event.pointerId);
  emu.push_key_event(key,true);
 });
 control.addEventListener('pointerup',releasePointerKey);
 control.addEventListener('pointercancel',releasePointerKey);
 control.addEventListener('lostpointercapture',releasePointerKey);
}
async function fetchWithProgress(url,label,expectedSize){
 const response=await fetch(url);
 if(!response.ok)throw new Error(`${label} could not be loaded (${response.status})`);
 const total=expectedSize||Number(response.headers.get('content-length'))||0;
 if(!response.body){
  const data=new Uint8Array(await response.arrayBuffer());
  status.textContent=`Loading ${label}: complete`;
  return data;
 }
 const reader=response.body.getReader(), chunks=[];
 let loaded=0;
 while(true){
  const {done,value}=await reader.read();
  if(done)break;
  chunks.push(value);
  loaded+=value.length;
  status.textContent=total
   ?`Loading ${label}: ${Math.min(100,Math.round(loaded/total*100))}%`
   :`Loading ${label}: ${(loaded/1024/1024).toFixed(1)} MB`;
 }
 const data=new Uint8Array(loaded);
 let offset=0;
 for(const chunk of chunks){data.set(chunk,offset);offset+=chunk.length}
 return data;
}
async function prepare(){
 if(loading)return;
 loading=true;
 status.classList.remove('is-hidden');
 try{
  status.textContent='Initializing WebAssembly…';
  const wasm=await init();
  wasmMemory=wasm.memory;
  emu=new WasmRiscv();
  const elf=await fetchWithProgress('./doom.elf','doom.elf',684520);
  emu.load_elf(elf);
  const wad=await fetchWithProgress('./doom1.wad?v=2','doom1.wad',28787748);
  emu.load_wad(wad);
  startGame();
 }catch(error){
  emu=undefined;
  status.textContent=`Loading failed: ${error.message}`;
  console.error(error);
 }finally{loading=false}
}
function startGame(){
 if(!emu||running)return;
 running=true;
 sample={instructions:0,emuMs:0,convertMs:0,canvasMs:0,frames:0,started:performance.now()};
 status.classList.add('is-hidden');
 requestAnimationFrame(frame);
}
function frame(now){
 if(!running)return;
 try{
  emu.set_ticks_ms(now|0);
  const emuStart=performance.now();
  emu.run(INSTRUCTIONS_PER_FRAME);
  const emuEnd=performance.now();
  const source=new Uint8ClampedArray(wasmMemory.buffer,emu.framebuffer_ptr(),emu.framebuffer_size());
  const pixels=source.slice();
  for(let i=0;i<pixels.length;i+=4){const blue=pixels[i];pixels[i]=pixels[i+2];pixels[i+2]=blue;pixels[i+3]=255}
  const convertEnd=performance.now();
  ctx.putImageData(new ImageData(pixels,640,400),0,0);
  const canvasEnd=performance.now();
  sample.instructions+=INSTRUCTIONS_PER_FRAME;
  sample.emuMs+=emuEnd-emuStart;
  sample.convertMs+=convertEnd-emuEnd;
  sample.canvasMs+=canvasEnd-convertEnd;
  sample.frames++;
  if(canvasEnd-sample.started>=1000)reportMetrics(canvasEnd);
  const out=emu.uart_output();if(out)console.log(out);
  if(!emu.halted())requestAnimationFrame(frame);else{running=false;status.textContent='Program finished';status.classList.remove('is-hidden')}
 }catch(e){running=false;status.textContent=String(e);status.classList.remove('is-hidden');console.error(e)}
}
function reportMetrics(now){
 const seconds=(now-sample.started)/1000, frames=sample.frames||1;
 metrics.mips.textContent=`MIPS: ${(sample.instructions/(sample.emuMs/1000)/1e6).toFixed(1)}`;
 metrics.fps.textContent=`FPS: ${(sample.frames/seconds).toFixed(1)}`;
 metrics.emu.textContent=`CPU: ${(sample.emuMs/frames).toFixed(2)} ms`;
 metrics.convert.textContent=`Pixels: ${(sample.convertMs/frames).toFixed(2)} ms`;
 metrics.canvas.textContent=`Canvas: ${(sample.canvasMs/frames).toFixed(2)} ms`;
 metrics.total.textContent=`Frame: ${((sample.emuMs+sample.convertMs+sample.canvasMs)/frames).toFixed(2)} ms`;
 sample={instructions:0,emuMs:0,convertMs:0,canvasMs:0,frames:0,started:now};
}
prepare();
</script></body></html>
